<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한양대 풋살동아리</title>
<meta name="theme-color" content="#0e4a84">
<meta name="description" content="한양대 풋살동아리 멤버 전용 앱: 평점·등급, 라인업, 활동 투표, 일정">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HY풋살">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-column mobile app — sticky club header, scrolling view, fixed bottom tab bar; lineups drawn on a futsal court */
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f5f8fc; --ink:#0f1c2e; --muted:#5b6b80; --line:#d8e0ea;
  --brand:#0e4a84; --brand-ink:#ffffff; --brand-soft:#e3edf8;
  --accent:#e8601a; --accent-soft:#fdeee4;
  --court:#1b5a93; --court-line:rgba(255,255,255,.78);
  --good:#1f8a5b; --warn:#b97409; --bad:#c23b3b;
  --gS:#b8860b; --gA:#0e4a84; --gB:#23857a; --gC:#68778c; --gD:#9a5f4e;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b121d; --surface:#131d2b; --surface-2:#18243450; --ink:#e7eef7; --muted:#93a3b8; --line:#26354a;
    --brand:#5d9de0; --brand-ink:#08131f; --brand-soft:#16304d;
    --accent:#ff8a4c; --accent-soft:#3a2216;
    --court:#16446f; --court-line:rgba(255,255,255,.6);
    --good:#4cc08a; --warn:#e3a33d; --bad:#ef6b6b;
    --gS:#e5b53a; --gA:#6aa8ea; --gB:#4fbfae; --gC:#97a5b8; --gD:#d18b76;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b121d; --surface:#131d2b; --surface-2:#18243450; --ink:#e7eef7; --muted:#93a3b8; --line:#26354a;
  --brand:#5d9de0; --brand-ink:#08131f; --brand-soft:#16304d;
  --accent:#ff8a4c; --accent-soft:#3a2216;
  --court:#16446f; --court-line:rgba(255,255,255,.6);
  --good:#4cc08a; --warn:#e3a33d; --bad:#ef6b6b;
  --gS:#e5b53a; --gA:#6aa8ea; --gB:#4fbfae; --gC:#97a5b8; --gD:#d18b76;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.crest svg{width:24px;height:24px}
.club{flex:1;min-width:0}
.club h1{font-family:var(--display);font-weight:400;font-size:21px;margin:0;line-height:1.15;letter-spacing:.2px;text-wrap:balance}
.club p{margin:0;color:var(--muted);font-size:12.5px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;margin:4px 0 10px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.view{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .t{display:flex;align-items:center;gap:8px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.match{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.train{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.chip.pos{min-width:38px;justify-content:center}
.gb{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-family:var(--display);font-size:16px;color:#fff;flex:none;line-height:1}
.gb.sm{width:22px;height:22px;font-size:13px;border-radius:6px}
.gb.g-S{background:var(--gS)} .gb.g-A{background:var(--gA)} .gb.g-B{background:var(--gB)} .gb.g-C{background:var(--gC)} .gb.g-D{background:var(--gD)}
.gb.g-none{background:transparent;color:var(--muted);border:1.5px dashed var(--line);font-family:var(--body);font-size:12px}
.gb.prov{background:transparent!important;border:2px dashed currentColor}
.gb.prov.g-S{color:var(--gS)} .gb.prov.g-A{color:var(--gA)} .gb.prov.g-B{color:var(--gB)} .gb.prov.g-C{color:var(--gC)} .gb.prov.g-D{color:var(--gD)}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
/* home */
.next{display:flex;gap:14px;align-items:stretch}
.dday{flex:none;width:86px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px}
.dday b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.dday span{font-size:11.5px;opacity:.85;margin-top:4px}
.dday.match{background:var(--accent);color:#fff}
.evtitle{font-weight:700;font-size:16px;margin:2px 0;text-wrap:balance}
.meta{color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:1px}
.att{display:flex;gap:6px;margin-top:12px}
.att button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.att button:disabled,.opt:disabled{opacity:.55;cursor:not-allowed}
.att button em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:500}
.att button[aria-pressed="true"].y{background:var(--good);border-color:var(--good);color:#fff}
.att button[aria-pressed="true"].n{background:var(--bad);border-color:var(--bad);color:#fff}
.att button[aria-pressed="true"].m{background:var(--warn);border-color:var(--warn);color:#fff}
.att button[aria-pressed="true"] em{color:inherit;opacity:.9}
.who{font-size:12.5px;color:var(--muted);margin-top:8px}
.dist{display:flex;gap:6px}
.dist div{flex:1;text-align:center;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);padding:8px 2px}
.dist .gb{margin:0 auto 4px}
.dist b{display:block;font-size:15px}
.progress{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.mecard{display:flex;align-items:center;gap:12px}
/* grades list */
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:22px 28px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.mrow:first-child{border-top:0}
.mrow .rank{color:var(--muted);font-size:13px;text-align:right}
.mrow .nm{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.mrow .nm span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sub{font-size:12px;color:var(--muted)}
.mrow .sc{text-align:right}
.mrow .sc b{font-size:16px;display:block;line-height:1.2}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px;margin-top:3px}
.bars i{width:5px;background:var(--brand);border-radius:2px;opacity:.75}
.me-tag{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 4px}
.done-tag{font-size:11px;color:var(--good);font-weight:700}
.todo-tag{font-size:11px;color:var(--accent);font-weight:700}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.attr{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.attr .track{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.attr .track i{display:block;height:100%;background:var(--brand)}
/* lineup */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button,.seg label{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer;position:relative}
.seg button[aria-pressed="true"],.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg label{padding:0}
.seg label span{display:block;padding:7px 6px;border-radius:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible) span{outline:2px solid var(--brand)}
.evpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.evpick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;text-align:left;font-size:12.5px;line-height:1.35}
.evpick button b{display:block;font-size:13.5px}
.evpick button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.court{width:100%;max-width:340px;display:block;margin:0 auto}
.court .bg{fill:var(--court)}
.court .ln{stroke:var(--court-line);stroke-width:2;fill:none}
.court .spot{fill:var(--court-line)}
.court .pc{fill:#fff;stroke-width:3}
.court .pc.g-S{stroke:var(--gS)} .court .pc.g-A{stroke:var(--gA)} .court .pc.g-B{stroke:var(--gB)} .court .pc.g-C{stroke:var(--gC)} .court .pc.g-D{stroke:var(--gD)} .court .pc.g-none{stroke:#9aa7b8}
.court .pl{font-family:var(--display);font-size:17px;text-anchor:middle;dominant-baseline:central}
.court .pl.g-S{fill:var(--gS)} .court .pl.g-A{fill:#0e4a84} .court .pl.g-B{fill:#23857a} .court .pl.g-C{fill:#68778c} .court .pl.g-D{fill:#9a5f4e} .court .pl.g-none{fill:#7d8a9c;font-family:var(--body);font-size:12px}
.court .pn{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:rgba(5,20,40,.65);stroke-width:3px}
.court .pp{font-size:10.5px;fill:rgba(255,255,255,.85);text-anchor:middle;font-weight:600}
.court .empty-c{fill:none;stroke:rgba(255,255,255,.6);stroke-dasharray:4 3;stroke-width:2}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.team{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.team h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.team h3 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.team ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.team li{display:flex;align-items:center;gap:7px;font-size:14px}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pool button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;text-align:left;font-size:13.5px;min-width:0}
.pool button .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pool button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pool button .ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.pool button[aria-pressed="true"] .ck{background:var(--brand);border-color:var(--brand)}
.pool button[aria-pressed="true"] .ck::after{content:"";width:8px;height:4px;border-left:2px solid var(--brand-ink);border-bottom:2px solid var(--brand-ink);transform:rotate(-45deg) translate(1px,-1px)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.d-y{background:var(--good)} .dot.d-n{background:var(--bad)} .dot.d-m{background:var(--warn)} .dot.d-x{background:var(--line)}
.lt{width:100%;border-collapse:collapse;font-size:13.5px}
.lt td{padding:6px 4px;border-top:1px solid var(--line)}
.lt td:first-child{color:var(--muted);width:64px}
/* vote */
.opt{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;overflow:hidden;margin-top:8px}
.opt .fill{position:absolute;inset:0 auto 0 0;background:var(--brand-soft);z-index:0;transition:width .3s}
.opt > *:not(.fill){position:relative;z-index:1}
.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt .top{display:flex;align-items:center;gap:8px}
.opt .lab{font-weight:700;flex:1}
.opt .cnt{font-weight:700}
.opt .vs{font-size:12px;color:var(--muted);margin-top:2px}
.opt .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand)}
.opt[aria-pressed="true"] .box::after{content:"";width:9px;height:5px;border-left:2px solid var(--brand-ink);border-bottom:2px solid var(--brand-ink);transform:rotate(-45deg) translate(1px,-1px)}
.lead{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px}
/* schedule */
.ev{border-top:1px solid var(--line);padding:14px 0}
.ev:first-child{border-top:0;padding-top:2px}
.evhead{display:flex;gap:10px;align-items:flex-start}
.datebox{flex:none;width:50px;text-align:center;border-radius:10px;border:1px solid var(--line);padding:5px 0;background:var(--surface-2)}
.datebox b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1}
.datebox span{font-size:11px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:13px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0;border-radius:10px}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current="page"]{color:var(--brand)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:84%}}
.sheet h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-height:42px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slider{display:grid;grid-template-columns:72px 1fr 30px;gap:10px;align-items:center}
.slider label{font-weight:600;font-size:14px}
.slider label small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.slider input{width:100%;accent-color:var(--brand)}
.slider output{font-weight:700;text-align:right;font-size:16px}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 0 0 82px}
.optrow{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px}
.optrow select,.optrow input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;min-height:40px}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font-weight:600}
.apps{display:flex;flex-direction:column}
.app-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.app-row:first-child{border-top:0;padding-top:0}
.card.join{border-color:var(--brand);background:linear-gradient(180deg,var(--brand-soft),var(--surface) 70%)}
.authwrap{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.authcard{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.authcard form{display:flex;flex-direction:column;gap:12px}
.authh{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.authmsg{font-size:13.5px;color:var(--bad);min-height:1em}
.authmsg.ok{color:var(--good)}
.steps{display:flex;gap:4px;margin:2px 0 10px}
.steps span{flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:5px 2px;border-radius:7px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.steps span.done{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.confirmed{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-size:15px}
.confirmed.big b{font-size:18px}
.pickrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pickrow:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.daychecks{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dc{position:relative}
.dc input{position:absolute;opacity:0}
.dc span{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 0;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface)}
.dc span small{font-weight:500;font-size:10.5px;color:var(--muted)}
.dc input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.dc input:checked+span small{color:inherit;opacity:.85}
.dc input:disabled+span{opacity:.35;cursor:not-allowed}
.dc input:focus-visible+span{outline:2px solid var(--brand)}
.semrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.semrow button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.semrow button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:18px;margin-top:2px}
.plus{color:var(--good)} .minus{color:var(--bad)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.thumbs button{padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .pdfb{position:absolute;left:3px;bottom:3px;font-size:10px;font-weight:700;background:var(--bad);color:#fff;border-radius:4px;padding:0 4px}
.thumbs .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:grid;place-items:center}
.act{border-top:1px solid var(--line);padding:14px 0}
.act:first-child{border-top:0;padding-top:2px}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:start;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.lrow:first-child{border-top:0}
.lrow .amt{font-weight:700;text-align:right}
.lrow .bal{font-size:11.5px;color:var(--muted);text-align:right}
.rc{font-size:11.5px;color:var(--muted)}
.viewer img{width:100%;border-radius:10px;display:block}
.report{position:fixed;inset:0;z-index:40;background:#fff;color:#111;overflow:auto;color-scheme:light}
.report .bar{position:sticky;top:0;background:#f3f5f8;border-bottom:1px solid #d9dee6;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:8px;align-items:center;z-index:1}
.report .bar .btn{background:#fff;color:#111;border-color:#cfd6df}
.report .bar .btn.primary{background:#0e4a84;color:#fff;border-color:#0e4a84}
.rp{max-width:780px;margin:0 auto;padding:28px 22px 60px;font-size:13.5px;line-height:1.6}
.rp h1{font-size:22px;margin:0 0 4px;text-align:center}
.rp .sub{text-align:center;color:#555;margin-bottom:18px}
.rp h2{break-after:avoid;font-size:16px;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid #0e4a84}
.rp h3{font-size:14px;margin:16px 0 6px}
.rp table{width:100%;border-collapse:collapse;font-size:12.5px}
.rp th,.rp td{border:1px solid #c9cfd8;padding:5px 6px;vertical-align:top}
.rp th{background:#eef2f7;font-weight:700;white-space:nowrap}
.rp td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rp .meta td:first-child{width:110px;background:#eef2f7;font-weight:700}
.rp .ph{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.rp .ph figure{margin:0;break-inside:avoid}
.rp .ph img{width:100%;max-height:300px;object-fit:contain;border:1px solid #ddd;background:#fafafa}
.rp .ph figcaption{font-size:11px;color:#555}
.rp .blk{break-inside:avoid}
.rp .sign{margin-top:30px;text-align:right}
@media print{
  body > *:not(#report){display:none!important}
  .report{position:static;overflow:visible}
  .report .bar{display:none}
  .rp{padding:0;max-width:none}
  @page{margin:14mm}
}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const DAYS=['월','화','수','목','금','토','일'];
const POS={GK:'GK',FIXO:'픽소',ALA:'아라',PIVO:'피보'};
const POS_DESC={GK:'골키퍼',FIXO:'수비 중심',ALA:'측면',PIVO:'최전방'};
const ATTRS=[['atk','공격','슈팅·결정력'],['def','수비','태클·위치선정'],['pas','패스','시야·연계'],['tec','기술','드리블·볼터치'],['sta','체력','활동량']];
const GRADES=[['S',8],['A',7],['B',6],['C',5],['D',-1]];
const MIN_N=3;
const TYPES={match:'경기',train:'훈련',etc:'기타'};
const TABS=['home','grades','lineup','vote','schedule','records'];

/* ---------- state ---------- */
const st={tab:'home',matchRatings:[],showAllGames:false,members:[],manual:[],profiles:[],roster:[],ratings:[],polls:[],votes:[],events:[],club:null,isAdmin:false,isOwner:false,staff:[],myName:'',showRejected:false,ledger:[],activities:[],sem:null,recTab:'act',
  myId:null,canWrite:null,readOnly:false,noDb:false,loading:{},slow:false,
  lineupEv:null,pool:{},mode:'match',teams:2,lineIdx:0,showPast:false,showOldPolls:false};
let DB=null,USER=null;
let AUTH=null;let installEvt=null;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isYmd=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
const isHm=s=>/^\d{2}:\d{2}$/.test(String(s||''));
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const dowK=d=>DAYS[(d.getDay()+6)%7];
const fmtD=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${dowK(d)})`;};
const fmtShort=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}`;};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=()=>ymd(new Date());
const ddays=s=>Math.round((parse(s)-parse(today()))/864e5);
const ddayLabel=n=>n===0?'D-DAY':n>0?`D-${n}`:`D+${-n}`;
const clamp=v=>Math.max(1,Math.min(10,Number(v)||0));
const fmt1=v=>v==null?'–':(Math.round(v*10)/10).toFixed(1);
const posOf=m=>POS[m&&m.pos]?m.pos:'ALA';
const mem=id=>st.members.find(m=>m.id===id);
const myMember=()=>st.myId?st.members.find(m=>m.userId===st.myId):null;
const rosterOf=uid=>st.roster.find(r=>r.id===uid);
const approvedSet=()=>new Set(st.roster.filter(r=>r.status==='approved').map(r=>r.id));
const myProfile=()=>st.myId?st.profiles.find(p=>p.id===st.myId)||null:null;
function myStatus(){
  if(!st.myId)return 'anon';if(!myProfile())return 'none';
  const r=rosterOf(st.myId);return r&&r.status==='approved'?'approved':(r&&r.status==='rejected'?'rejected':'pending');
}
const pendingApps=()=>st.profiles.filter(p=>{const r=rosterOf(p.id);return !r||(r.status!=='approved'&&r.status!=='rejected');});
const rejectedApps=()=>st.profiles.filter(p=>{const r=rosterOf(p.id);return r&&r.status==='rejected';});
const accountReady=()=>!st.loading.profiles&&!st.loading.roster;
function cleanProfile(p){
  return Object.assign(p,{name:String(p.name||'').trim().slice(0,20),pos:POS[p.pos]?p.pos:'ALA',
    year:/^\d{2}$/.test(String(p.year||''))?String(p.year):'',dept:String(p.dept||'').trim().slice(0,20),intro:String(p.intro||'').trim().slice(0,60),
    num:(typeof p.num==='number'&&p.num>=0&&p.num<1000)?p.num:null});
}
function rebuildMembers(){
  const ok=approvedSet();const list=[];
  st.profiles.forEach(p=>{if(ok.has(p.id)&&p.name)list.push(Object.assign({},p,{userId:p.id,account:true}));});
  st.manual.forEach(m=>list.push(Object.assign({},m,{userId:null,account:false})));
  st.members=list;
}
const myVotes=()=>st.votes.find(v=>v.id===st.myId)||null;
const myRatings=()=>st.ratings.find(r=>r.id===st.myId)||null;
const evKey=e=>`${e.date} ${isHm(e.time)?e.time:'99:99'}`;
const validEvents=()=>st.events.filter(e=>isYmd(e.date));
const upcoming=()=>validEvents().filter(e=>e.date>=today()).sort((a,b)=>evKey(a)<evKey(b)?-1:1);
const pastEvents=()=>validEvents().filter(e=>e.date<today()).sort((a,b)=>evKey(a)<evKey(b)?1:-1);
const evTitle=e=>{const t=String(e.title||'').trim();if(t)return t;if(e.type==='match')return `vs ${e.opp||'상대 미정'}`;if(e.type==='train')return '정기 활동';return '동아리 일정';};
const uidName=uid=>{const m=st.members.find(x=>x.userId===uid);if(m)return m.name;const p=st.profiles.find(x=>x.id===uid);return p&&p.name?p.name:'회원';};

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------- stats & grades ---------- */
function gradeOf(ov){for(const [g,t] of GRADES){if(ov>=t)return g;}return 'D';}
const clampG=v=>Math.max(1,Math.min(10,Math.round((Number(v)||0)*2)/2));
const gamePlayers=e=>Array.isArray(e.players)?e.players.filter(id=>typeof id==='string'&&!!mem(id)):[];
const myMatch=()=>st.matchRatings.find(r=>r.id===st.myId)||null;
function gameResults(e,okSet){
  const ok=okSet||approvedSet();const res={};gamePlayers(e).forEach(id=>res[id]={sum:0,n:0});let raters=0;
  st.matchRatings.forEach(r=>{if(!ok.has(r.id))return;const g=r.s&&typeof r.s==='object'?r.s[e.id]:null;if(!g||typeof g!=='object')return;let any=false;
    for(const id in res){const m=mem(id);if(m&&m.userId===r.id)continue;const v=g[id];if(typeof v==='number'&&isFinite(v)){res[id].sum+=clampG(v);res[id].n++;any=true;}}
    if(any)raters++;});
  Object.defineProperty(res,'_raters',{value:raters,enumerable:false});
  return res;
}
const gamesWithPlayers=()=>validEvents().filter(e=>gamePlayers(e).length&&e.date<=today()).sort((a,b)=>evKey(a)<evKey(b)?1:-1);
function canRateGame(e){
  if(!canAct()||e.date>today())return false;
  const me=myMember();const ps=gamePlayers(e);
  if(me&&ps.includes(me.id))return ps.length>1;
  return st.isAdmin&&ps.length>0;
}
const iRated=e=>{const r=myMatch();return !!(r&&r.s&&r.s[e.id]&&Object.keys(r.s[e.id]).length);};
let _statsCache=null;
function stats(){
  if(_statsCache)return _statsCache;
  const out={};const okRaters=approvedSet();
  const gm={};
  validEvents().filter(e=>gamePlayers(e).length).sort((a,b)=>evKey(a)<evKey(b)?1:-1).forEach(e=>{const r=gameResults(e,okRaters);
    for(const id in r){if(!r[id].n)continue;const x=gm[id]||(gm[id]={avgs:[],cnt:0,recent:[]});const a=r[id].sum/r[id].n;x.avgs.push(a);x.cnt+=r[id].n;if(x.recent.length<5)x.recent.push({e,avg:a,n:r[id].n});}});
  for(const m of st.members){
    const acc={};ATTRS.forEach(([k])=>acc[k]=0);let n=0;
    for(const r of st.ratings){
      if(!okRaters.has(r.id))continue;
      if(m.userId&&r.id===m.userId)continue;
      const s=r.s&&typeof r.s==='object'?r.s[m.id]:null;
      if(!s||typeof s!=='object')continue;
      if(!ATTRS.every(([k])=>typeof s[k]==='number'))continue;
      ATTRS.forEach(([k])=>acc[k]+=clamp(s[k]));n++;
    }
    const avg={};let ov=null;
    if(n){ATTRS.forEach(([k])=>avg[k]=acc[k]/n);ov=ATTRS.reduce((a,[k])=>a+avg[k],0)/ATTRS.length;}
    const g=gm[m.id];const gOv=g?g.avgs.reduce((a,b)=>a+b,0)/g.avgs.length:null;
    const fin=g?gOv:ov;
    out[m.id]={n,avg,abilityOv:ov,gOv,games:g?g.avgs.length:0,gN:g?g.cnt:0,recent:g?g.recent:[],basis:g?'game':(n?'ability':null),
      ov:fin,grade:fin!=null?gradeOf(fin):null,prov:g?g.cnt<MIN_N:(n>0&&n<MIN_N)};
  }
  return _statsCache=out;
}
function badge(s,sm){
  if(!s||!s.grade)return `<span class="gb g-none${sm?' sm':''}" title="평가 없음">–</span>`;
  return `<span class="gb g-${s.grade}${s.prov?' prov':''}${sm?' sm':''}" title="${s.prov?'잠정 등급 (평가 '+s.n+'명)':'등급 '+s.grade}">${s.grade}</span>`;
}
const ovOf=(id,S)=>{const s=S[id];return s&&s.ov!=null?s.ov:5;};
const attrsOf=(id,S)=>{const s=S[id];const a={};ATTRS.forEach(([k])=>a[k]=s&&s.n?s.avg[k]:5);return a;};
function sortedMembers(S){
  return [...st.members].sort((a,b)=>{
    const A=S[a.id],B=S[b.id];
    if(A.ov==null&&B.ov==null)return String(a.name).localeCompare(String(b.name),'ko');
    if(A.ov==null)return 1;if(B.ov==null)return -1;return B.ov-A.ov;
  });
}

/* ---------- lineup algorithms ---------- */
const FIT={
  FIXO:a=>a.def*.6+a.pas*.25+a.sta*.15,
  ALA:a=>a.tec*.35+a.pas*.25+a.sta*.25+a.atk*.15,
  PIVO:a=>a.atk*.6+a.tec*.2+a.sta*.2
};
function perms(arr){if(arr.length<=1)return [arr];const out=[];arr.forEach((x,i)=>{perms(arr.slice(0,i).concat(arr.slice(i+1))).forEach(p=>out.push([x].concat(p)));});return out;}
function assignLine(players){
  const slots=['FIXO','ALA','ALA','PIVO'],keys=['FIXO','ALA1','ALA2','PIVO'];
  const padded=players.concat(Array(4-players.length).fill(null));
  let best=null,bs=-1e9;
  for(const p of perms(padded)){
    let s=0;p.forEach((pl,i)=>{if(!pl)return;s+=FIT[slots[i]](pl.a)+(pl.m.pos===slots[i]?1.5:0);});
    if(s>bs){bs=s;best=p;}
  }
  const line={};keys.forEach((k,i)=>line[k]=best[i]?best[i].id:null);return line;
}
function buildMatch(ids,S){
  const ps=ids.map(id=>({id,m:mem(id),a:attrsOf(id,S),ov:ovOf(id,S)})).filter(p=>p.m);
  const gks=ps.filter(p=>p.m.pos==='GK').sort((a,b)=>b.ov-a.ov);
  let field=ps.filter(p=>p.m.pos!=='GK');
  const bench=[];let gk=null,gkTemp=false;
  if(gks.length){gk=gks[0].id;const extra=gks.slice(1);
    if(field.length<4){while(field.length<4&&extra.length)field.push(extra.shift());}
    extra.forEach(p=>bench.push(p.id));
  }else if(field.length){
    const chosen=[...field].sort((a,b)=>(b.a.def*.7+b.a.sta*.3)-(a.a.def*.7+a.a.sta*.3))[0];
    gk=chosen.id;gkTemp=true;field=field.filter(p=>p.id!==chosen.id);
  }
  field.sort((a,b)=>b.ov-a.ov);
  const nLines=Math.max(1,Math.min(3,Math.floor(field.length/4)));
  const lines=[];
  for(let i=0;i<nLines;i++)lines.push(assignLine(field.slice(i*4,i*4+4)));
  field.slice(nLines*4).forEach(p=>bench.push(p.id));
  return {mode:'match',gk,gkTemp,lines,bench};
}
function buildSplit(ids,S,k,jitter){
  const ps=ids.filter(id=>mem(id)).map(id=>({id,ov:ovOf(id,S),key:ovOf(id,S)+(jitter?(Math.random()-.5)*.8:0),gk:mem(id).pos==='GK'}));
  const teams=Array.from({length:k},()=>[]);
  const sum=t=>t.reduce((a,p)=>a+p.ov,0);
  const place=p=>{let bi=0;for(let i=1;i<k;i++){const a=teams[i],b=teams[bi];if(a.length<b.length||(a.length===b.length&&sum(a)<sum(b)))bi=i;}teams[bi].push(p);};
  ps.filter(p=>p.gk).sort((a,b)=>b.key-a.key).forEach(place);
  ps.filter(p=>!p.gk).sort((a,b)=>b.key-a.key).forEach(place);
  const spread=()=>{const s=teams.map(sum);return Math.max(...s)-Math.min(...s);};
  for(let it=0;it<60;it++){
    let improved=false;const cur=spread();
    outer:for(let i=0;i<k;i++)for(let j=i+1;j<k;j++)for(let x=0;x<teams[i].length;x++)for(let y=0;y<teams[j].length;y++){
      const a=teams[i][x],b=teams[j][y];if(a.gk||b.gk)continue;
      teams[i][x]=b;teams[j][y]=a;
      if(spread()<cur-0.05){improved=true;break outer;}
      teams[i][x]=a;teams[j][y]=b;
    }
    if(!improved)break;
  }
  return {mode:'split',teams:teams.map(t=>t.sort((a,b)=>(b.gk-a.gk)||(b.ov-a.ov)).map(p=>p.id))};
}

/* ---------- writes ---------- */
const queues={};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function write(path,fn){
  if(!DB){toast('로그인해야 저장할 수 있어요');return Promise.reject();}
  if(st.readOnly){toast('보기 권한만 있어서 저장할 수 없어요');return Promise.reject();}
  const run=async()=>{
    try{await fn();}
    catch(e){
      if(e&&(e.code==='unavailable'||e.code==='deadline-exceeded')){await sleep(400+Math.random()*600);try{await fn();return;}catch(e2){e=e2;}}
      handleErr(e);throw e;
    }
  };
  const p=(queues[path]||Promise.resolve()).then(run,run);
  queues[path]=p.catch(()=>{});
  return p;
}
function handleErr(e){
  const c=e&&e.code;
  if(c==='taken'||c==='gone')return;
  if(c==='permission-denied')toast('권한이 없어요. 가입 승인 상태를 확인해 주세요');
  else if(c==='resource-exhausted')toast('요청이 너무 많아요. 잠시 후 다시 시도하세요');
  else toast('저장하지 못했어요. 다시 시도해 주세요');
}
async function upsertMine(col,patch){
  const ref=DB.doc(`${col}/${st.myId}`);
  return write(ref.path,async()=>{
    const snap=await ref.get();
    const cur=snap.exists?JSON.parse(JSON.stringify(snap.data())):{};
    const next=patch(cur);
    await ref.set(next);
  });
}

/* ----- vote ----- */
const SLOTS=['08','10','12','14','16','18','20'];
const slotLabel=s=>`${s}:00–${pad(Number(s)+2)}:00`;
function sortedPolls(){return [...st.polls].filter(p=>Array.isArray(p.days)).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));}
function currentPoll(){return sortedPolls()[0]||null;}
const pollDate=(p,d)=>isYmd(p.week)?ymd(addDays(parse(p.week),Number(d)||0)):null;
const dayLabel=(p,d)=>{const s=pollDate(p,d);return s?fmtD(s):(DAYS[d]+'요일');};
const dayKeys=p=>p.days.filter(d=>Number.isInteger(d)&&d>=0&&d<7).sort((a,b)=>a-b).map(d=>'d'+d);
function tally(p,field,keys){
  const res=keys.map(k=>({k,count:0,who:[]}));let voters=0;
  st.votes.forEach(v=>{const m=v[field];const arr=m&&typeof m==='object'&&Array.isArray(m[p.id])?m[p.id]:[];if(arr.length)voters++;res.forEach(r=>{if(arr.includes(r.k)){r.count++;r.who.push(uidName(v.id));}});});
  const max=Math.max(0,...res.map(r=>r.count));
  return {res,voters,max,lead:max?res.find(r=>r.count===max):null};
}
function pollStage(p){
  if(p.stage==='done'&&isYmd(p.date)&&SLOTS.includes(p.slot))return 'done';
  if(p.stage==='time'&&isYmd(p.date))return 'time';
  return 'date';
}
function pollSummary(p){
  const s=pollStage(p);
  if(s==='done')return {label:`${fmtD(p.date)} ${slotLabel(p.slot)}`,tag:'확정',count:0,voters:0,stage:''};
  if(s==='time'){const r=tally(p,'t',SLOTS);return {label:r.lead?`${fmtD(p.date)} ${slotLabel(r.lead.k)}`:fmtD(p.date),tag:r.lead?'시간 1위':'날짜 확정',count:r.lead?r.lead.count:0,voters:r.voters,stage:'시간 투표 중'};}
  const r=tally(p,'p',dayKeys(p));
  return {label:r.lead?dayLabel(p,Number(r.lead.k.slice(1))):'',tag:'날짜 1위',count:r.lead?r.lead.count:0,voters:r.voters,stage:'날짜 투표 중'};
}
function optList(p,field,keys,labelFn,mine,enabled){
  const r=tally(p,field,keys);
  return {r,html:r.res.map(x=>{const pressed=mine.includes(x.k);const w=r.max?x.count/r.max*100:0;const isLead=r.max&&x.count===r.max;
    return `<button class="opt" data-act="vote" data-field="${field}" data-poll="${esc(p.id)}" data-opt="${esc(x.k)}" aria-pressed="${pressed}" ${enabled?'':'disabled'}><span class="fill" style="width:${w}%"></span>
      <span class="top"><span class="box"></span><span class="lab">${esc(labelFn(x.k))}</span>${isLead?'<span class="lead">1위</span>':''}<span class="cnt num">${x.count}</span></span>
      ${x.who.length?`<span class="vs" style="display:block">${x.who.map(esc).join(', ')}</span>`:''}</button>`;}).join('')};
}
function stepper(stage){
  const steps=[['date','① 날짜 투표'],['time','② 시간 투표'],['done','③ 확정']];const i=steps.findIndex(s=>s[0]===stage);
  return `<div class="steps">${steps.map((s,j)=>`<span class="${j<i?'done':j===i?'on':''}">${s[1]}</span>`).join('')}</div>`;
}
function pollCard(p,full){
  const stage=pollStage(p);const mv=myVotes()||{};
  const range=isYmd(p.week)?`${fmtShort(p.week)} ~ ${fmtShort(ymd(addDays(parse(p.week),6)))}`:'';
  let h=`<div class="card"><h2><span class="t">${esc(p.title||'활동 투표')}</span><span class="muted small num">${range}</span></h2>${stepper(stage)}`;
  if(stage==='date'){
    const mine=mv.p&&Array.isArray(mv.p[p.id])?mv.p[p.id]:[];

function semesterOf(ds){

  if(m>=3&&m<=8)return {key:`${y}-1`,label:`${y}년 1학기`,from:`${y}-03-01`,to:`${y}-08-31`};

}

  let bal=carry;const rows=all.filter(l=>inSem(s,l.date)).map(l=>{bal+=l.kind==='in'?amt(l):-amt(l);return Object.assign({},l,{amt:amt(l),bal});});

const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfLibP=null;
function loadPdfJs(){
  if(pdfLibP)return pdfLibP;
  pdfLibP=new Promise((res,rej)=>{
    if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;res(window.pdfjsLib);return;}
    const s=document.createElement('script');s.src=PDFJS_URL;
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;res(window.pdfjsLib);}catch(e){rej(e);}};
    s.onerror=()=>{pdfLibP=null;rej(new Error('pdfjs'));};document.head.appendChild(s);
  });
  return pdfLibP;
}
async function pdfPages(file,maxPages){
  const lib=await loadPdfJs();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const n=Math.min(doc.numPages,maxPages);const pages=[];
  for(let i=1;i<=n;i++){
    const page=await doc.getPage(i);const v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:Math.min(3,1800/Math.max(v1.width,v1.height))});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;pages.push(c);
  }
  return {pages,total:doc.numPages};
}
function encodeSource(src,w,hgt,max,q){
  const c=document.createElement('canvas');
  const make=(mx,qq)=>{const s=Math.min(1,mx/Math.max(w,hgt));c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(hgt*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',qq);};
  let mx=max,qq=q,data=make(mx,qq);
  while(data.length>880000&&mx>500){mx=Math.round(mx*0.8);qq=Math.max(0.45,qq-0.07);data=make(mx,qq);}
  return {data,thumb:make(320,0.6)};
}
async function compressImage(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=url;});
    return encodeSource(img,img.naturalWidth,img.naturalHeight,max,q);
  }finally{URL.revokeObjectURL(url);}
}
const isPdfFile=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
const isImgFile=f=>/^image\//.test(f.type)||/\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name);
async function uploadPhotos(files,kind,maxCount,existing){
  let room=Math.max(0,maxCount-existing.length);const out=[];let skipped=0;
  for(const f of [...(files||[])]){
    if(room<=0){skipped++;continue;}
    const pdf=isPdfFile(f);let enc=[];
    try{
      if(pdf){
        toast(`PDF 바꾸는 중: ${f.name}`);
        const r=await pdfPages(f,room);
        enc=r.pages.map(c=>encodeSource(c,c.width,c.height,1800,0.75));
        if(r.total>r.pages.length)toast(`${f.name}: 앞 ${r.pages.length}쪽만 올렸어요 (최대 ${maxCount}장)`);
      }else if(isImgFile(f))enc=[await compressImage(f,kind==='receipt'?1800:1600,0.72)];
      else{toast(`${f.name}: 사진이나 PDF만 올릴 수 있어요`);continue;}
    }catch(e){toast(pdf?`${f.name}을(를) 열 수 없어요. 암호가 걸린 PDF인지 확인해 주세요`:`${f.name}을(를) 열 수 없어요. JPG·PNG로 다시 골라 주세요`);continue;}
    for(const r of enc){
      if(room<=0){skipped++;break;}
      toast(`올리는 중 ${out.length+1}장째`);
      const ref=DB.collection('files').doc();
      await write(ref.path,()=>ref.set({data:r.data,kind,src:pdf?'pdf':'image',name:String(f.name||'').slice(0,80),by:st.myId,at:Date.now()}));
      out.push({id:ref.id,thumb:r.thumb,pdf});room--;
    }
  }
  if(skipped)toast(`최대 ${maxCount}장까지라 일부는 빠졌어요`);
  return out;
}

    const btn=$('#sheet [data-act=saveSheet]');if(btn)btn.disabled=true;
    try{
      const added=await uploadPhotos($('#fPick').files,'receipt',10,sheetFiles);
      const body={kind:k,date,amount,cat:$('#lCat').value,memo,files:sheetFiles.concat(added),updatedAt:Date.now()};
      const ref=l?DB.doc('ledger/'+l.id):DB.collection('ledger').doc();
      await write(ref.path,()=>l?ref.update(body):ref.set(Object.assign(body,{by:st.myId,at:Date.now()})));
      removedFiles.forEach(id=>{const r=DB.doc('files/'+id);write(r.path,()=>r.delete()).catch(()=>{});});
      if(k==='out'&&!body.files.length)toast('저장했어요. 영수증 사진이 없으면 결산 인준이 어려울 수 있어요');else toast('저장했어요');
      closeSheet();
    }finally{if(btn&&btn.isConnected)btn.disabled=false;}
  });
}

function downloadCSV(){
  const s=curSem();const D=semData(s);
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines=[['번호','날짜','구분','항목','내용','수입','지출','잔액','증빙 사진 수'].map(q).join(',')];
  lines.push(['','','','','전기 이월','','',D.carry,''].map(q).join(','));
  D.rows.forEach((x,i)=>lines.push([i+1,x.date,x.kind==='in'?'수입':'지출',x.cat||'',x.memo||'',x.kind==='in'?x.amt:'',x.kind==='out'?x.amt:'',x.bal,cleanFiles(x.files).length].map(q).join(',')));
  lines.push(['','','','','합계',D.tin,D.tout,D.end,''].map(q).join(','));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`풋살동아리_${s.key}_결산.csv`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

  editLedger:d=>{const l=st.ledger.find(x=>x.id===d.id);if(l)ledgerSheet(l);},
  delLedger:(d,btn)=>twoStep(btn,'dl'+d.id,'한 번 더 누르면 삭제돼요',async()=>{const l=st.ledger.find(x=>x.id===d.id);const r=DB.doc('ledger/'+d.id);await write(r.path,()=>r.delete());
    if(l)cleanFiles(l.files).forEach(f=>{const fr=DB.doc('files/'+f.id);write(fr.path,()=>fr.delete()).catch(()=>{});});toast('삭제했어요');closeSheet();}),
  rmFile:d=>{const i=Number(d.i);const f=sheetFiles[i];if(!f)return;removedFiles.push(f.id);sheetFiles.splice(i,1);const el=$('#fileThumbs');if(el)el.innerHTML=editThumbs();},
  viewFile:d=>viewFile(d.id),
  openReport:()=>openReport(),
  closeReport:()=>{const el=$('#report');if(el){el.hidden=true;el.innerHTML='';}document.body.style.overflow='';},
  printReport:()=>{try{window.print();}catch(e){toast('인쇄를 열 수 없어요');}},
  csv:()=>downloadCSV(),
  newPoll:pollSheet,
  toggleOld:()=>{st.showOldPolls=!st.showOldPolls;render();},
  newEvent:()=>eventSheet(null),
  editEvent:d=>{const e=st.events.find(x=>x.id===d.ev);if(e)eventSheet(e);},
  delEvent:(d,btn)=>twoStep(btn,'de'+d.ev,'한 번 더 누르면 삭제돼요',async()=>{const ref=DB.doc('events/'+d.ev);await write(ref.path,()=>ref.delete());toast('일정을 삭제했어요');closeSheet();}),
  togglePast:()=>{st.showPast=!st.showPast;render();},
  goLineup:d=>{st.lineupEv=d.ev;location.hash='lineup';},
  pickEv:d=>{st.lineupEv=d.ev;st.lineIdx=0;render();},
  lineIdx:d=>{st.lineIdx=Number(d.i)||0;render();},
  mode:d=>{st.mode=d.v==='split'?'split':'match';render();},
  teams:d=>{st.teams=Number(d.v)||2;render();},
  pool:d=>{const s=st.pool[st.lineupEv];if(!s)return;s.has(d.id)?s.delete(d.id):s.add(d.id);render();},
  poolAll:()=>{st.pool[st.lineupEv]=new Set(st.members.map(m=>m.id));render();},
  poolNone:()=>{st.pool[st.lineupEv]=new Set();render();},
  poolAtt:()=>{const set=new Set();st.votes.forEach(v=>{if(v.a&&v.a[st.lineupEv]==='y'){const m=st.members.find(x=>x.userId===v.id);if(m)set.add(m.id);}});st.pool[st.lineupEv]=set;if(!set.size)toast('아직 참석 응답한 멤버가 없어요');render();},
  genLineup:async()=>{
    const e=st.events.find(x=>x.id===st.lineupEv);if(!e)return;
    const ids=[...(st.pool[e.id]||[])].filter(id=>mem(id));if(ids.length<2){toast('2명 이상 고르세요');return;}
    const S=stats();
    const L=st.mode==='split'?buildSplit(ids,S,Math.min(st.teams,ids.length),!!e.lineup):buildMatch(ids,S);
    L.at=Date.now();L.by=st.myId;
    const ref=DB.doc('events/'+e.id);
    let ok=true;
    await write(ref.path,async()=>{const s=await ref.get();if(!s.exists)throw {code:'gone'};const body=JSON.parse(JSON.stringify(s.data()));body.lineup=L;await ref.set(body);}).catch(e=>{ok=false;if(e&&e.code==='gone')toast('일정이 삭제되어 저장하지 못했어요');});
    if(ok){st.lineIdx=0;toast('라인업을 저장했어요. 모두에게 보여요');render();}
  }
};
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;
  const f=A[t.dataset.act];if(!f)return;ev.preventDefault();
  Promise.resolve(f(t.dataset,t,ev)).catch(()=>{});
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(t.type==='range'&&t.id.startsWith('r_')){const o=$('#o_'+t.id.slice(2));if(o)o.textContent=t.value;}
  if(t.type==='range'&&t.dataset.gid){const o=document.getElementById('go_'+t.dataset.gid);if(o)o.textContent=Number(t.value).toFixed(1);const sk=document.querySelector(`#sheet input[data-skip="${t.dataset.gid}"]`);if(sk)sk.checked=false;}
});
document.addEventListener('change',ev=>{
  if(ev.target.name==='eType'){const f=$('#oppField');if(f)f.hidden=ev.target.value!=='match';}
  if(ev.target.name==='pWeek'&&fillDays)fillDays();
  if(ev.target.name==='lKind'){const c=$('#lCat');if(c)c.innerHTML=CATS[ev.target.value==='in'?'in':'out'].map(x=>`<option>${x}</option>`).join('');}
  if(ev.target.id==='fPick'){const n=ev.target.files.length;const i=$('#fPickInfo');if(i)i.textContent=n?`새 사진 ${n}장 선택됨 · 저장할 때 올라가요`:'';}
  if(ev.target.id==='aEv'){const e=st.events.find(x=>x.id===ev.target.value);if(e){$('#aDate').value=e.date;$('#aTitle').value=evTitle(e);
    const n=st.votes.filter(v=>v.a&&v.a[e.id]==='y').length;if(n)$('#aPeople').value=n;if(!$('#aDesc').value)$('#aDesc').value=[isHm(e.time)?e.time+(isHm(e.end)?'–'+e.end:''):'',e.place||'',e.type==='match'&&e.opp?'vs '+e.opp:''].filter(Boolean).join(' · ');}}
});
$('#scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim')closeSheet();});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#scrim').classList.contains('open'))closeSheet();});

/* ---------- routing ---------- */
function route(){const h=(location.hash||'').slice(1);st.tab=TABS.includes(h)?h:'home';render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
let unsubs=[];let fullOn=false;
function usable(){return !!(st.myId&&(st.isAdmin||myStatus()==='approved'));}
function stopAll(){unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];fullOn=false;}
function subCol(key,path,assign){
  st.loading[key]=true;
  unsubs.push(DB.collection(path).onSnapshot(snap=>{
    assign(snap.docs.map(d=>Object.assign({},d.data(),{id:d.id})));
    st.loading[key]=false;
    scheduleRender();
  },()=>{st.loading[key]=false;scheduleRender();}));
}
function subDoc(path,fn){unsubs.push(DB.doc(path).onSnapshot(s=>{fn(s);scheduleRender();},()=>{fn(null);scheduleRender();}));}
function maybeFull(){
  if(fullOn||!usable())return;fullOn=true;
  subCol('members','members',a=>{st.manual=a.filter(m=>typeof m.name==='string'&&m.name.trim()).map(m=>Object.assign(m,{name:m.name.trim().slice(0,20),pos:POS[m.pos]?m.pos:'ALA',num:typeof m.num==='number'?m.num:null}));rebuildMembers();});
  subCol('profiles','profiles',a=>{st.profiles=a.map(cleanProfile);rebuildMembers();});
  subCol('roster','roster',a=>{st.roster=a.filter(r=>typeof r.status==='string');rebuildMembers();});
  subCol('ratings','ratings',a=>{st.ratings=a;});
  subCol('matchRatings','matchRatings',a=>{st.matchRatings=a;});
  subCol('polls','polls',a=>{st.polls=a;});
  subCol('votes','votes',a=>{st.votes=a;});
  subCol('ledger','ledger',a=>{st.ledger=a;});
  subCol('activities','activities',a=>{st.activities=a;});
  subCol('events','events',a=>{st.events=a.map(e=>Object.assign(e,{type:TYPES[e.type]?e.type:'etc'}));});
  subDoc('config/club',s=>{st.club=s&&s.exists?s.data():null;});
  setTimeout(()=>{st.slow=true;scheduleRender();},10000);
}
function startUser(u){
  stopAll();
  Object.assign(st,{myId:u.uid,email:u.email||'',members:[],manual:[],profiles:[],roster:[],ratings:[],matchRatings:[],polls:[],votes:[],events:[],ledger:[],activities:[],club:null,
    admins:null,adminsLoaded:false,isAdmin:false,isOwner:false,staff:[],loading:{profiles:true,roster:true},slow:false,pool:{}});
  if(pendingProfile){const p=pendingProfile;pendingProfile=null;DB.doc('profiles/'+u.uid).set(Object.assign(p,{at:Date.now()})).catch(e=>toast('가입 정보를 저장하지 못했어요. 내 계정에서 다시 작성해 주세요'));}
  subDoc('config/admins',s=>{
    const d=s&&s.exists?s.data():null;st.admins=d;st.adminsLoaded=true;
    st.isOwner=!!(d&&d.owner===st.myId);st.staff=d&&Array.isArray(d.staff)?d.staff.filter(x=>typeof x==='string'):[];
    const was=st.isAdmin;st.isAdmin=st.isOwner||st.staff.includes(st.myId);
    if(fullOn&&was&&!st.isAdmin&&myStatus()!=='approved')location.reload();
    maybeFull();
  });
  subDoc('profiles/'+u.uid,s=>{
    if(!fullOn){st.profiles=s&&s.exists?[cleanProfile(Object.assign({},s.data(),{id:s.id}))]:[];}
    st.loading.profiles=false;rebuildMembers();maybeFull();
  });
  subDoc('roster/'+u.uid,s=>{
    const d=s&&s.exists?Object.assign({},s.data(),{id:s.id}):null;
    if(fullOn){if(!st.isAdmin&&!(d&&d.status==='approved'))location.reload();}
    else st.roster=d?[d]:[];
    st.loading.roster=false;rebuildMembers();maybeFull();
  });
}
function showSetup(msg){
  $('#auth').hidden=false;$('#appRoot').hidden=true;document.querySelector('nav.tabs').hidden=true;
  $('#auth').innerHTML=`<div class="authcard"><h1 class="authh">설정이 필요해요</h1><div class="small">${msg}</div></div>`;
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(st.myId)render();});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
const cfg=window.FIREBASE_CONFIG;
if(typeof firebase==='undefined'){showSetup('앱을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.');}
else if(!cfg||!cfg.apiKey||/YOUR_/.test(cfg.apiKey)){showSetup('config.js에 Firebase 설정값을 넣어야 해요.');}
else{
  firebase.initializeApp(cfg);
  AUTH=firebase.auth();AUTH.languageCode='ko';
  DB=firebase.firestore();
  AUTH.onAuthStateChanged(u=>{
    closeSheet();
    if(!u){stopAll();st.myId=null;authMode='login';$('#auth').hidden=false;$('#appRoot').hidden=true;document.querySelector('nav.tabs').hidden=true;renderAuth();return;}
    $('#auth').hidden=true;$('#auth').innerHTML='';$('#appRoot').hidden=false;
    startUser(u);route();
  });
}
})();
</script>
</body>
